# Spark SQL in local mode logged in as the spark service principal, with the shared client-site.xml in HADOOP_CONF_DIR
# and an Iceberg catalog on the Kerberized Hive Metastore.
spark.ui.enabled                                    false
spark.driver.host                                   localhost
spark.driver.bindAddress                            127.0.0.1
spark.driver.extraJavaOptions                       -Djava.security.krb5.conf=${krb5Conf}
spark.default.parallelism                           1
spark.sql.shuffle.partitions                        1
spark.sql.cli.print.header                          false
spark.sql.catalogImplementation                     in-memory
spark.sql.warehouse.dir                             ${warehouse}
spark.sql.extensions                                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.${catalog}                        org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.${catalog}.type                   hive
spark.sql.catalog.${catalog}.uri                    ${metastoreUri}
spark.sql.catalog.${catalog}.warehouse              ${warehouse}
spark.sql.catalog.${catalog}.cache-enabled          false
# Trino writes strings with DELTA_LENGTH_BYTE_ARRAY encoding, which the Iceberg vectorized Parquet reader does not support
spark.sql.iceberg.vectorization.enabled             false
spark.hadoop.hive.metastore.uris                    ${metastoreUri}
spark.hadoop.hive.metastore.sasl.enabled            true
spark.hadoop.hive.metastore.kerberos.principal      ${metastorePrincipal}
spark.security.credentials.hive.enabled             false
spark.security.credentials.hadoopfs.enabled         false
spark.security.credentials.hbase.enabled            false
