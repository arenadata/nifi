# Iceberg catalog on the Kerberized Hive Metastore with the trino service principal and the shared client-site.xml
connector.name=iceberg
iceberg.catalog.type=hive_metastore
hive.metastore.uri=${metastoreUri}
hive.metastore.authentication.type=KERBEROS
hive.metastore.service.principal=${metastorePrincipal}
hive.metastore.client.principal=${principal}
hive.metastore.client.keytab=${keytab}
fs.hadoop.enabled=true
hive.config.resources=${configResources}
hive.hdfs.authentication.type=KERBEROS
hive.hdfs.trino.principal=${principal}
hive.hdfs.trino.keytab=${keytab}
iceberg.metadata-cache.enabled=false
