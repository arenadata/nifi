# Ranger Admin installation properties
DB_FLAVOR=POSTGRES
SQL_CONNECTOR_JAR=/usr/share/java/postgresql.jar

# PostgreSQL database connection
db_root_user=nifi
db_root_password=
db_host=postgres
db_name=postgres

# Ranger Admin user credentials
rangerAdmin_password=admin
rangerTagsync_password=admin
rangerUsersync_password=admin
keyadmin_password=admin

# Policy Manager URL
policymgr_external_url=http://ranger-admin:6080
policymgr_http_enabled=true

# Unix user/group
unix_user=ranger
unix_group=ranger

# Audit to Solr
audit_store=solr
audit_solr_urls=http://solr:8983/solr/ranger_audits
audit_solr_user=
audit_solr_password=
audit_solr_zookeepers=NONE
