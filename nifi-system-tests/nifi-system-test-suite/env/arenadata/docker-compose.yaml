version: "3.8"
services:
    mdw:
        image: "gpdb6-distributed:it"
        restart: on-failure:3
        working_dir: /home/gpadmin
        hostname: mdw
        ports:
            - "6000:6000"
        environment:
            - DOCKER_GP_CLUSTER_HOSTS=mdw,smdw,sdw1,sdw2
            - DOCKER_GP_MASTER_SERVER=mdw
            - DOCKER_GP_STANDBY_SERVER=smdw
            - DOCKER_GP_SEGMENT_SERVERS=sdw1,sdw2
            - DOCKER_GP_PRIMARY_SEGMENTS_PER_HOST=2
            - DOCKER_GP_WITH_MIRROR=true
        depends_on:
            - sdw1
            - sdw2
            - smdw
        healthcheck:
            test: 'bash /home/gpadmin/healthcheck.sh true 2 true'
            interval: 10s
            timeout: 1s
            retries: 20
        entrypoint: ["bash", "start_adb.sh" ]
        privileged: true
        extra_hosts:
            - "host.docker.internal:host-gateway"
        sysctls:
            kernel.sem: 500 1024000 200 4096
        networks:
          - nifinet

    sdw1:
        image: "gpdb6-distributed:it"
        restart: on-failure:3
        privileged: true
        hostname: sdw1
        healthcheck:
            test: 'bash /home/gpadmin/healthcheck.sh false 2 true'
        environment:
            - DOCKER_GP_CLUSTER_HOSTS=mdw,smdw,sdw1,sdw2
            - DOCKER_GP_MASTER_SERVER=mdw
            - DOCKER_GP_STANDBY_SERVER=smdw
            - DOCKER_GP_SEGMENT_SERVERS=sdw1,sdw2
            - DOCKER_GP_PRIMARY_SEGMENTS_PER_HOST=2
            - DOCKER_GP_WITH_MIRROR=true
        entrypoint: ["bash", "start_adb.sh" ]
        extra_hosts:
            - "host.docker.internal:host-gateway"
        sysctls:
            kernel.sem: 500 1024000 200 4096
        networks:
          - nifinet

    sdw2:
        image: "gpdb6-distributed:it"
        restart: on-failure:3
        privileged: true
        hostname: sdw2
        healthcheck:
            test: 'bash /home/gpadmin/healthcheck.sh false 2 true'
        environment:
            - DOCKER_GP_CLUSTER_HOSTS=mdw,smdw,sdw1,sdw2
            - DOCKER_GP_MASTER_SERVER=mdw
            - DOCKER_GP_STANDBY_SERVER=smdw
            - DOCKER_GP_SEGMENT_SERVERS=sdw1,sdw2
            - DOCKER_GP_PRIMARY_SEGMENTS_PER_HOST=2
            - DOCKER_GP_WITH_MIRROR=true
        entrypoint: ["bash", "start_adb.sh" ]
        extra_hosts:
            - "host.docker.internal:host-gateway"
        sysctls:
            kernel.sem: 500 1024000 200 4096
        networks:
          - nifinet

    smdw:
        image: "gpdb6-distributed:it"
        restart: on-failure:3
        privileged: true
        hostname: smdw
        healthcheck:
            test: 'bash /home/gpadmin/healthcheck.sh true 2 true'
        environment:
            - DOCKER_GP_CLUSTER_HOSTS=mdw,smdw,sdw1,sdw2
            - DOCKER_GP_MASTER_SERVER=mdw
            - DOCKER_GP_STANDBY_SERVER=smdw
            - DOCKER_GP_SEGMENT_SERVERS=sdw1,sdw2
            - DOCKER_GP_PRIMARY_SEGMENTS_PER_HOST=2
            - DOCKER_GP_WITH_MIRROR=true
        entrypoint: ["bash", "start_adb.sh" ]
        extra_hosts:
            - "host.docker.internal:host-gateway"
        sysctls:
            kernel.sem: 500 1024000 200 4096
        networks:
          - nifinet

    postgres:
        image: "docker.io/library/postgres:12.0"
        restart: unless-stopped
        environment:
            POSTGRES_DB: 'postgres'
            POSTGRES_USER: 'nifi'
#            POSTGRES_PASSWORD: 'nifi'
        networks:
          - nifinet
        ports:
            - '5432:5432'
        healthcheck:
            test: psql -d postgres -U nifi -Atc 'SELECT 1;'
            interval: 30s
            timeout: 15s
            retries: 3

    zookeeper:
      image: 'bitnami/zookeeper:latest'
      environment:
        - ALLOW_ANONYMOUS_LOGIN=yes
      healthcheck:
        test: [ "CMD", "zkServer.sh", "status"]
        interval: 30s
        timeout: 15s
        retries: 3
      networks:
        - nifinet

    nifi01:
        image: nifi:it
        ports:
          - 6980:8080
          - 8000:8000 #debug port
        networks:
          - nifinet
        environment:
          - NIFI_WEB_HTTP_PORT=8080
          - NIFI_CLUSTER_IS_NODE=true
          - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
          - NIFI_ZK_CONNECT_STRING=zookeeper:2181
          - NIFI_ELECTION_MAX_WAIT=1 min
          - NIFI_SENSITIVE_PROPS_KEY=MySuperSecretKey
        healthcheck:
          test: [ "CMD", "curl", "-f", "http://nifi01:8080/nifi-api/flow/status" ]
          interval: 60s
          timeout: 15s
          retries: 3
        volumes:
          - "nifi_node1_data:/data"
          - "../../target/postgresql-42.7.5.jar:/opt/postgresql-42.7.5.jar"

    nifi02:
        image: nifi:it
        ports:
          - 6979:8080
          - 8002:8000
        networks:
          - nifinet
        environment:
          - NIFI_WEB_HTTP_PORT=8080
          - NIFI_CLUSTER_IS_NODE=true
          - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
          - NIFI_ZK_CONNECT_STRING=zookeeper:2181
          - NIFI_ELECTION_MAX_WAIT=1 min
          - NIFI_SENSITIVE_PROPS_KEY=MySuperSecretKey
        healthcheck:
          test: [ "CMD", "curl", "-f", "http://nifi02:8080/nifi-api/flow/status" ]
          interval: 60s
          timeout: 15s
          retries: 3
        volumes:
          - "nifi_node2_data:/data"
          - "../../target/postgresql-42.7.5.jar:/opt/postgresql-42.7.5.jar"

    nifi03:
        image: nifi:it
        ports:
          - 6978:8080
          - 8003:8000
        networks:
          - nifinet
        environment:
          - NIFI_WEB_HTTP_PORT=8080
          - NIFI_CLUSTER_IS_NODE=true
          - NIFI_CLUSTER_NODE_PROTOCOL_PORT=8082
          - NIFI_ZK_CONNECT_STRING=zookeeper:2181
          - NIFI_ELECTION_MAX_WAIT=1 min
          - NIFI_SENSITIVE_PROPS_KEY=MySuperSecretKey
        healthcheck:
          test: [ "CMD", "curl", "-f", "http://nifi03:8080/nifi-api/flow/status" ]
          interval: 60s
          timeout: 15s
          retries: 3
        volumes:
          - "nifi_node3_data:/data"
          - "../../target/postgresql-42.7.5.jar:/opt/postgresql-42.7.5.jar"

volumes:
  nifi_node1_data:
  nifi_node2_data:
  nifi_node3_data:

networks:
  nifinet:
#    external: true